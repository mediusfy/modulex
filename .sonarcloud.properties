# SonarCloud Automatic Analysis configuration. This project has no scanner
# step in CI — SonarCloud's automatic analysis runs on every push/PR, and
# automatic analysis reads THIS file, not sonar-project.properties (which is
# kept for any future CI-based scanner run; keep the two exclusion lists in
# sync).
#
# tools/provenanceci/go.mod is excluded because the module's only require is
# the parent module via a local `replace ../..` and every import is
# stdlib-only, so `go mod tidy` emits no go.sum — the lock file text:S8566
# asks for cannot exist for this module.
sonar.exclusions=mocks/**,**/vendor/**,coverage.out,tools/provenanceci/go.mod
