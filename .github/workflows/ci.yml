name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.x', 'stable']

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ matrix.go }}

    - name: Get Dependencies
      run: go mod download

    - name: Verify go.mod is tidy
      run: |
        go mod tidy -diff

    - name: Verify Formatting
      run: |
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "code is not formatted. Run gofmt -s -w ."
          gofmt -s -l .
          exit 1
        fi

    - name: Build Code
      run: go build -v ./...

    - name: Run Vet
      run: go vet ./...

    - name: Run Tests
      run: go test -v -race -count=1 -coverprofile=coverage.out ./...

  integration-test:
    name: Integration Tests (RabbitMQ)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.x'

    - name: Get Dependencies
      run: go mod download

    - name: Run RabbitMQ Integration Tests
      env:
        RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      run: go test -v -race -count=1 ./rabbitmq/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.x'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
      with:
        version: v2.12.2

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.x'

    - name: Run govulncheck
      run: make vuln

  consumer-boundary:
    name: Consumer Dependency Boundary
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.x'

    - name: Verify core package has no adapter dependencies
      run: make check-consumer-boundary

  module-boundary:
    name: Module Boundary Analyzer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.x'

    - name: Run the optional modboundary analyzer on examples/deployment
      run: make check-module-boundary

  api-compat:
    name: API Compatibility Report
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.x'

    - name: Report API changes since the latest tag
      run: make check-api-compat

  changelog:
    name: CHANGELOG.md Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Verify CHANGELOG.md is updated when required
      env:
        GITHUB_ACTOR: ${{ github.actor }}
      run: ./scripts/check-changelog.sh "origin/${{ github.event.pull_request.base.ref }}" "${{ github.event.pull_request.head.sha }}"

  provenance:
    name: Publish Provenance Artifact
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - integration-test
      - lint
      - vuln
      - consumer-boundary
      - module-boundary
      - api-compat
      - changelog
    # Always publish a record of this run's outcome, even when one or more
    # of the jobs above failed or was cancelled — that is the case a
    # provenance artifact is most useful for. This job itself only fails if
    # it could not produce a valid envelope (e.g. a bug in provenanceci);
    # individual job outcomes are recorded as data inside the artifact, not
    # reflected in this job's own exit status.
    if: always()

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.26.x'

    - name: Build provenanceci
      working-directory: tools/provenanceci
      run: go build -o /tmp/provenanceci ./cmd/provenanceci

    - name: Build provenance envelope
      env:
        COMMIT: ${{ github.sha }}
        BRANCH: ${{ github.ref_name }}
        RESULT_BUILD_AND_TEST: ${{ needs.build-and-test.result }}
        RESULT_INTEGRATION_TEST: ${{ needs.integration-test.result }}
        RESULT_LINT: ${{ needs.lint.result }}
        RESULT_VULN: ${{ needs.vuln.result }}
        RESULT_CONSUMER_BOUNDARY: ${{ needs.consumer-boundary.result }}
        RESULT_MODULE_BOUNDARY: ${{ needs.module-boundary.result }}
        RESULT_API_COMPAT: ${{ needs.api-compat.result }}
        RESULT_CHANGELOG: ${{ needs.changelog.result }}
      run: |
        /tmp/provenanceci \
          -commit "$COMMIT" \
          -branch "$BRANCH" \
          -out provenance.json \
          -job "build-and-test=$RESULT_BUILD_AND_TEST" \
          -job "integration-test=$RESULT_INTEGRATION_TEST" \
          -job "lint=$RESULT_LINT" \
          -job "vuln=$RESULT_VULN" \
          -job "consumer-boundary=$RESULT_CONSUMER_BOUNDARY" \
          -job "module-boundary=$RESULT_MODULE_BOUNDARY" \
          -job "api-compat=$RESULT_API_COMPAT" \
          -job "changelog=$RESULT_CHANGELOG"

    - name: Upload provenance artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: provenance-${{ github.sha }}
        path: provenance.json
        retention-days: 90
