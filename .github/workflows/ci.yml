name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.x', 'stable']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Get Dependencies
      run: go mod download

    - name: Verify go.mod is tidy
      run: |
        go mod tidy -diff

    - name: Verify Formatting
      run: |
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "code is not formatted. Run gofmt -s -w ."
          gofmt -s -l .
          exit 1
        fi

    - name: Build Code
      run: go build -v ./...

    - name: Run Vet
      run: go vet ./...

    - name: Run Tests
      run: go test -v -race -count=1 -coverprofile=coverage.out ./...

  integration-test:
    name: Integration Tests (RabbitMQ)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'

    - name: Get Dependencies
      run: go mod download

    - name: Run RabbitMQ Integration Tests
      env:
        RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      run: go test -v -race -count=1 ./rabbitmq/...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'

    - name: Run govulncheck
      run: make vuln

  consumer-boundary:
    name: Consumer Dependency Boundary
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'

    - name: Verify core package has no adapter dependencies
      run: make check-consumer-boundary

  module-boundary:
    name: Module Boundary Analyzer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'

    - name: Run the optional modboundary analyzer on examples/deployment
      run: make check-module-boundary

  api-compat:
    name: API Compatibility Report
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'

    - name: Report API changes since the latest tag
      run: make check-api-compat

  changelog:
    name: CHANGELOG.md Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Verify CHANGELOG.md is updated when required
      env:
        GITHUB_ACTOR: ${{ github.actor }}
      run: ./scripts/check-changelog.sh "origin/${{ github.event.pull_request.base.ref }}" "${{ github.event.pull_request.head.sha }}"
