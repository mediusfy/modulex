name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Get Dependencies
      run: go mod download

    - name: Verify Formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go code is not formatted. Run gofmt."
          exit 1
        fi

    - name: Build Code
      run: go build -v ./...

    - name: Run Tests
      run: go test -v -race -coverprofile=coverage.out ./...
