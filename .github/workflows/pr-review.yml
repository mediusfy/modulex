name: PR Review

# The deterministic review engine, run natively from this repository's own
# source (ADR-0035, 2026-08-21 addendum): pr_pipeline stays private, and
# GitHub refuses a public caller resolving a private repo's reusable
# workflow ("workflow was not found", verified empirically), so modulex does
# not call pr_pipeline at all. The AI commentary layer arrives separately
# via the badger App's repository_dispatch flow (pr_pipeline's
# pr-review-dispatch.yml), which needs no cross-repo workflow resolution.
#
# This job needs no secrets and holds a read-only token, so it runs on fork
# PRs too — it executes the repository's own make targets from the PR head,
# exactly like the rest of CI does.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# A push to a PR fires `synchronize` -- cancel a still-running review for the
# same PR rather than letting two runs race.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the base ref exists for the base...head diff.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: tools/agentcli/go.sum

      # The CLI is this repository's own code; `go install @version` can't
      # build the nested module (its go.mod replace-directs at the parent),
      # so build from the checkout.
      - name: Build the modulex CLI
        run: go build -C tools/agentcli -o "$RUNNER_TEMP/modulex" ./cmd/modulex

      # The CLI exits 1 when any check reports fail (secret scan, protected
      # paths, or a declared make gate); the Envelope on stdout is the
      # auditable review artifact. Advisory for now: the exit code is
      # surfaced as a warning annotation + step summary instead of failing
      # the job, because CheckProtectedPaths flags the additive [Unreleased]
      # CHANGELOG entries most legitimate PRs carry (the contract text
      # explicitly allows those; the check does not implement that exception
      # yet -- tracked). Once it does, replace the final `exit 0` with
      # `exit "$status"` to make this a hard gate.
      - name: Run the deterministic review engine
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          "$RUNNER_TEMP/modulex" agent handoff \
            -agent pr-review-ci \
            -base "origin/${BASE_REF}" \
            -head HEAD > envelope.json 2> engine-stderr.txt
          status=$?
          set -e
          cat engine-stderr.txt >&2
          if [ "$status" -ne 0 ]; then
            echo "::warning title=PR review engine (advisory)::$(tail -n 1 engine-stderr.txt)"
            {
              echo "### PR review engine — advisory findings"
              echo ""
              echo '```'
              tail -n 5 engine-stderr.txt
              echo '```'
              echo ""
              echo "Full provenance Envelope: see the \`pr-review-envelope\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload provenance envelope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-review-envelope-${{ github.event.pull_request.number }}
          path: envelope.json
          retention-days: 14
          if-no-files-found: ignore
