name: PR Review

# The deterministic review engine, run natively from this repository's own
# source (ADR-0035, 2026-08-21 addendum): pr_pipeline stays private, and
# GitHub refuses a public caller resolving a private repo's reusable
# workflow ("workflow was not found", verified empirically), so modulex does
# not call pr_pipeline at all. The AI commentary layer arrives separately
# via the badger App's repository_dispatch flow (pr_pipeline's
# pr-review-dispatch.yml), which needs no cross-repo workflow resolution.
#
# This job needs no secrets and holds a read-only token, so it runs on fork
# PRs too — it executes the repository's own make targets from the PR head,
# exactly like the rest of CI does.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# A push to a PR fires `synchronize` -- cancel a still-running review for the
# same PR rather than letting two runs race.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the base ref exists for the base...head diff.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: tools/agentcli/go.sum

      # The CLI is this repository's own code; `go install @version` can't
      # build the nested module (its go.mod replace-directs at the parent),
      # so build from the checkout.
      - name: Build the modulex CLI
        run: go build -C tools/agentcli -o "$RUNNER_TEMP/modulex" ./cmd/modulex

      # The CLI exits 1 when any check reports fail; the Envelope on stdout
      # is the auditable review artifact. Gating is split by what a failure
      # means:
      #
      #   - check-protected-paths measures "needs explicit human approval"
      #     (agent-safety-policy.md). In PR CI the reviewer's approval of
      #     the PR IS that approval, and the check already exempts the
      #     legitimate routine cases (additive [Unreleased] CHANGELOG
      #     entries, non-retract go.mod edits), so a hit here surfaces as a
      #     prominent warning for the reviewer, not a red check -- otherwise
      #     every workflow or CODEOWNERS PR would be permanently red.
      #   - Every other failed check (secret scan, declared make gates) is
      #     a real defect in the diff and fails the job.
      #   - No valid envelope at all (operational failure) fails the job.
      - name: Run the deterministic review engine
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          "$RUNNER_TEMP/modulex" agent handoff \
            -agent pr-review-ci \
            -base "origin/${BASE_REF}" \
            -head HEAD > envelope.json 2> engine-stderr.txt
          status=$?
          set -e
          cat engine-stderr.txt >&2

          if ! jq -e '.verification' envelope.json > /dev/null 2>&1; then
            echo "::error title=PR review engine::no valid envelope produced (exit $status)"
            exit 1
          fi

          pp_count=$(jq -r '[.verification[] | select(.status=="fail" and .name=="check-protected-paths")] | length' envelope.json)
          if [ "$pp_count" -gt 0 ]; then
            echo "::warning title=Protected paths touched -- reviewer attention required::this PR changes protected paths; approving the PR is the human approval the safety policy requires"
            {
              echo "### Protected paths touched — reviewer attention required"
              echo ""
              echo '```'
              jq -r '.verification[] | select(.status=="fail" and .name=="check-protected-paths") | .message' envelope.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          hard=$(jq -r '[.verification[] | select(.status=="fail" and .name!="check-protected-paths") | .name] | join(", ")' envelope.json)
          if [ -n "$hard" ]; then
            echo "::error title=PR review engine::check(s) failed: $hard"
            {
              echo "### PR review engine — failed checks: $hard"
              echo ""
              echo '```'
              jq -r '.verification[] | select(.status=="fail" and .name!="check-protected-paths") | "\(.name): \(.message // .reason // "no detail")"' envelope.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload provenance envelope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-review-envelope-${{ github.event.pull_request.number }}
          path: envelope.json
          retention-days: 14
          if-no-files-found: ignore
