name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Get Dependencies
        run: go mod download

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Verify Formatting
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "code is not formatted. Run gofmt -s -w ."
            gofmt -s -l .
            exit 1
          fi

      - name: Run Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.12.2

      - name: Vulnerability Scan
        run: make vuln
        timeout-minutes: 10

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          generate_release_notes: true

      - name: Notify proxy.golang.org and pkg.go.dev
        env:
          MODULE: github.com/mediusfy/modulex
          VERSION: ${{ github.ref_name }}
        run: |
          echo "Notifying Go module proxy for $MODULE@$VERSION..."
          STATUS=$(curl -sL --proto-redir "=https" -o /dev/null -w "%{http_code}" \
            "https://proxy.golang.org/$MODULE/@v/$VERSION.info" \
            || true)
          echo "proxy.golang.org responded with HTTP $STATUS"
          echo ""
          echo "Triggering pkg.go.dev to fetch and display documentation..."
          STATUS=$(curl -sL --proto-redir "=https" -o /dev/null -w "%{http_code}" \
            "https://pkg.go.dev/$MODULE@$VERSION" \
            || true)
          echo "pkg.go.dev responded with HTTP $STATUS"
          echo ""
          echo "Release $VERSION published."
          echo "View at: https://pkg.go.dev/$MODULE"
